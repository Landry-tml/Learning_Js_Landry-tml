  <style>
    * {
      box-sizing: border-box;
    }
    body, h1, p, ul {
      margin: 0;
    }
    ul {
      padding: 0;
      list-style: none;
    }
    body {
      font-family: "Inter", Arial, sans-serif;
    }
    :root {
  --green: hsl(75, 94%, 57%);
  --white: hsl(0, 0%, 100%);
  --grey-700: hsl(0, 0%, 20%);
  --grey-800: hsl(0, 0%, 12%);
  --grey-900: hsl(0, 0%, 8%);
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2.5rem 1.5rem;
  background-color: var(--grey-900);
  color: var(--white);
} 
.card {
  width: 100%;
  max-width: 23.4375rem; /* ~375px */
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  background-color: var(--grey-800);
  border-radius: 1.25rem;
  padding: 2.5rem 2.5rem 2.75rem;
}
.card__avatar {
  width: 6.25rem;
  height: 6.25rem;
  border-radius: 50%;
  object-fit: cover;
}
.card__name {
  margin-top: 1.5rem;
  font-size: 1.5rem;
  font-weight: 700;
}

.card__location {
  margin-top: 0.25rem;
  font-size: 0.875rem;
  font-weight: 400;
  color: var(--green);
}

.card__bio {
  margin-top: 1.25rem;
  font-size: 0.875rem;
}
.card__links {
  width: 100%;
  margin-top: 1.75rem;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.link {
  display: block;
  width: 100%;
  padding: 0.75rem 0;
  border-radius: 0.5rem;
  background-color: var(--grey-700);
  color: var(--white);
  font-size: 0.9375rem;
  font-weight: 600;
  text-decoration: none;
}
.link {
  transition: background-color 0.2s ease, color 0.2s ease;
}

.link:hover,
.link:focus-visible {
  background-color: var(--green);
  color: var(--grey-900);
}

.link:focus-visible {
  outline: 2px solid var(--white);
  outline-offset: 2px;
}
.attribution {
  font-size: 0.6875rem;
  text-align: center;
  color: var(--white);
}
.attribution a {
  color: hsl(228, 45%, 44%);
}
  </style>
