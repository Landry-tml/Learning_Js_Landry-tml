<!DOCTYPE html>
<html>
<head>
  <title>Random Quote Generator</title>
  <style>
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #1e1e2f;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .card {
    background: #2b2b40;
    padding: 40px;
    border-radius: 12px;
    max-width: 500px;
    text-align: center;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
  }
</style>
</head>
<body>
    <div class="card">
    <p id="quoteText">Click the button to get a quote!</p>
    <p id="quoteAuthor"></p>
    <button id="newQuoteBtn">New Quote</button>
  </div>
</body>
</html>
