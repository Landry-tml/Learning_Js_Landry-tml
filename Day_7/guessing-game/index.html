<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game — Code Breaker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="console">
     <div class="console-bar">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
</div>
  <h1>&gt; Code Breaker</h1>

  <div class="row">
  <input type="number" id="guessInput" min="1" max="100" placeholder="Enter guess...">
  <button id="guessBtn">Guess</button>
</div>

<div class="message" id="message"></div>
<p class="subtitle">A secret number between 1 and 100 has been generated. Crack the code before you run out of attempts.</p>

<div class="meta">
  <span id="attemptsLeft">Attempts left: 10</span>
  <span id="status">Status: Active</span>
</div>

 <ul class="history" id="history"></ul>

 <button class="again" id="againBtn">Play Again</button>
 </div>

    <script src="script.js"></script>
</body>
</html>
