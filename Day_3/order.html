<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Summary</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    * {
        box-sizing: border-box;
    }
    body, h1, p {
        margin: 0;
    }
    body {
        font-family: "Red Hat Display", Arial, sans-serif;
    }

    :root {
        --purple-900: hsl(225, 100%, 94%);
        --purple-700: hsl(245, 75%, 52%);
        --blue-900: hsl(223, 47%, 23%);
        --blue-700: hsl(224, 23%, 55%);
        --blue-300: hsl(225, 100%, 98%);
        --white: hsl(0, 0%,100%);
    }

    body {
        background-color: var(--purple-900);
        background-image: url("./assets/image/pattern-background-desktop.svg");
        background-repeat: no-repeat;
        background-size: contain;
    }
  </style>
</head>
<body>

  <main>
    <img src="./assets/images/illustration-hero.svg" alt="">

    <h1>Order Summary</h1>
    <p>You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>

    <div>
      <img src="./assets/images/icon-music.svg" alt="">
      <div>
        <p>Annual Plan</p>
        <p>$59.99/year</p>
      </div>
      <a href="#">Change</a>
    </div>

    <button>Proceed to Payment</button>
    <button>Cancel Order</button>
  </main>

</body>
</html>
