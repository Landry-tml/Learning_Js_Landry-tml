<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="box">
  <h1>Address Book</h1>
  <p class="count" id="countLabel">0 contacts</p>

  <div class="panel">
  <form id="contactForm">
    <input type="text" id="nameInput" placeholder="Full name" required>
    <input type="tel" id="phoneInput" placeholder="Phone">
    <input type="email" id="emailInput" placeholder="Email">
    <div class="form-actions">
      <button type="submit" class="btn-primary" id="submitBtn">Add Contact</button>
      <button type="button" class="btn-secondary" id="cancelEditBtn">Cancel</button>
    </div>
  </form>
</div>

<input type="text" class="search-input" id="searchInput" placeholder="Search by name, phone, or email...">

<div class="cards" id="cardsList"></div>
<p class="empty-msg" id="emptyMsg" style="display:none;">No contacts yet. Add your first one above.</p>
</div>
    <script src="script.js"></script>
</body>
</html>
