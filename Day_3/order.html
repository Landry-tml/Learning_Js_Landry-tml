<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Summary</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    * {
        box-sizing: border-box;
    }
    body, h1, p {
        margin: 0;
    }
    body {
        font-family: "Red Hat Display", Arial, sans-serif;
    }

    :root {
        --purple-900: hsl(225, 100%, 94%);
        --purple-700: hsl(245, 75%, 52%);
        --blue-900: hsl(223, 47%, 23%);
        --blue-700: hsl(224, 23%, 55%);
        --blue-300: hsl(225, 100%, 98%);
        --white: hsl(0, 0%,100%);
    }

    body {
        background-color: var(--purple-900);
        background-image: url("./assets/image/pattern-background-desktop.svg");
        background-repeat: no-repeat;
        background-size: contain;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
    }

    .card {
        width: 100%;
        max-width: 25rem;
        overflow: hidden;
        box-shadow: 0 2rem 3rem -1rem hsla(245, 75%, 52%, 0.3);
        text-align: center;
        background-color: var(--white);
        border-radius: 1.25rem;
    }

    .card__hero {
        display: block;
        width: 100%;
    }

    .card__content {
  padding: 2rem 2.5rem 0;
}

.card__title {
  font-size: 1.375rem;
  font-weight: 900;
  color: var(--blue-900);
}

.card__description {
  margin-top: 0.75rem;
  font-size: 0.9375rem;
  line-height: 1.6;
  color: var(--blue-700);
}

.plan {
  margin-top: 1.5rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1rem;
  background-color: var(--blue-300);
  border-radius: 0.75rem;
  text-align: left;
}

.plan__info {
  flex: 1;
}

.plan__name {
  font-size: 0.9375rem;
  font-weight: 900;
  color: var(--blue-900);
}

.plan__price {
  font-size: 0.9375rem;
  color: var(--blue-700);
}

.plan__change {
  font-size: 0.8125rem;
  font-weight: 700;
  color: var(--purple-700);
  text-decoration: underline;
}

.plan__change:hover {
  color: hsl(245, 75%, 70%);
  text-decoration: none;
}

  </style>
</head>
<body>

  <main class="card">
    <img class="card__hero" src="./assets/images/illustration-hero.svg" alt="">

    <div class="card__content">
    <h1 class="card__title">Order Summary</h1>
    <p class="card__description">You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>
    </div>

    <div class="plan">
      <img class="plan__icon" src="./assets/images/icon-music.svg" alt="">
      <div class="plan__info">
        <p class="plan__name">Annual Plan</p>
        <p class="plan__price">$59.99/year</p>
      </div>
      <a class="plan__channge" href="#">Change</a>
    </div>

    <button>Proceed to Payment</button>
    <button>Cancel Order</button>
  </main>

</body>
</html>
