<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart — Receipt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="receipt">
  <h1>Corner Market</h1>
  <p class="store-sub">*** shopping cart ***</p>
  <hr class="divider">

  <div class="add-form">
  <input type="text" id="itemName" placeholder="Item name">
  <input type="number" id="itemPrice" placeholder="Price" min="0" step="0.01">
</div>
<label class="options-row">
  <input type="checkbox" id="priorityCheck" style="width:auto;">
  Add as priority item (goes to top)
</label>
<button id="addBtn" style="width:100%;">Add to Cart</button>

<hr class="divider">

<div class="tool-row">
  <button id="removeFirstBtn">Remove First</button>
  <button id="removeLastBtn">Remove Last</button>
</div>

<ul class="items" id="itemsList"></ul>

<div class="empty-msg" id="emptyMsg">Your cart is empty.</div>

<hr class="divider">
<div class="total-row">
  <span>Total</span>
  <span id="totalValue">FCFA0.00</span>
</div>
</div>

    <script src="script.js"></script>
</body>
</html>
