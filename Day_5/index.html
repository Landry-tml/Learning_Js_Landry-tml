<!DOCTYPE html>
<html>
<head>
  <title>Random Quote Generator</title>
  <style>
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #1e1e2f;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .card {
    background: #2b2b40;
    padding: 40px;
    border-radius: 12px;
    max-width: 500px;
    text-align: center;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
  }

  #quoteText {
  font-size: 22px;
  font-style: italic;
  margin-bottom: 10px;
  min-height: 80px;
}

#quoteAuthor {
  font-size: 16px;
  color: #a0a0c0;
  margin-bottom: 20px;
}

button {
  background: #6c5ce7;
  color: white;
  border: none;
  padding: 12px 24px;
  font-size: 16px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.2s ease;
}

button:hover {
  background: #5a4bd6;
}
</style>
</head>
<body>
    <div class="card">
    <p id="quoteText">Click the button to get a quote!</p>
    <p id="quoteAuthor"></p>
    <button id="newQuoteBtn">New Quote</button>
  </div>
</body>
</html>
